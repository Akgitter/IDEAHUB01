version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - ideahub-network
    volumes:
      - ./uploads:/app/uploads

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    networks:
      - ideahub-network
    volumes:
      - redis-data:/data

networks:
  ideahub-network:
    driver: bridge

volumes:
  redis-data:
